[build]
  # Base directory where the frontend code is located
  base = "."
  
  # Build command
  command = "npm run build"
  
  # Directory to publish (Next.js output)
  publish = ".next"

[build.environment]
  # Node version
  NODE_VERSION = "20.11.0"

  NEXT_PUBLIC_API_URL = "https://workrant.onrender.com/api"
  NEXT_PUBLIC_BACKEND_URL = "https://workrant.onrender.com"
  NEXT_PUBLIC_BACKEND_HOSTNAME = "workrant.onrender.com"
  # NEXT_PUBLIC_BACKEND_PORT=443
    
  # Production environment variables
  # NEXT_PUBLIC_API_URL = "https://api.workrant.app/api"
  # NEXT_PUBLIC_BACKEND_URL = "https://api.workrant.app"
   # NEXT_PUBLIC_MEDIA_URL = "https://api.workrant.app/media"
  NODE_ENV = "production"
  NEXT_PUBLIC_ENVIRONMENT = "production"
  NEXT_PUBLIC_SECURE_MODE = "true"
  NEXT_PUBLIC_DEBUG = "false"

# Next.js specific settings
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.workrant.app/*"
  to = "https://workrant.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.workrant.app/*"
  to = "https://workrant.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.workrant.netlify.app/*"
  to = "https://workrant.netlify.app/:splat"
  status = 301
  force = true

# Force HTTPS on all domains
[[redirects]]
  from = "http://workrant.app/*"
  to = "https://workrant.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://workrant.netlify.app/*"
  to = "https://workrant.netlify.app/:splat"
  status = 301
  force = true

# Headers for security

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.workrant.app https://api.workrant.app/media http://localhost:8000 https://workrant.onrender.com; font-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"