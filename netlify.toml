[build]
  # Base directory where the frontend code is located
  base = "."
  
  # Build command
  command = "npm run build"
  
  # Directory to publish (Next.js output)
  publish = ".next"

[build.environment]
  # Node version
  NODE_VERSION = "18.17.0"
  
  # Production environment variables
  NEXT_PUBLIC_API_URL = "https://api.workrant.app/api"
  NEXT_PUBLIC_BACKEND_URL = "https://api.workrant.app"
  NEXT_PUBLIC_MEDIA_URL = "https://api.workrant.app/media"
  NODE_ENV = "production"
  NEXT_PUBLIC_ENVIRONMENT = "production"
  NEXT_PUBLIC_SECURE_MODE = "true"
  NEXT_PUBLIC_DEBUG = "false"

# Next.js specific settings
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
