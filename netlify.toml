[build]
  base = "."
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.11.0"
  NEXT_PUBLIC_API_URL = "https://workrant.onrender.com/api"
  NEXT_PUBLIC_BACKEND_URL = "https://workrant.onrender.com"
  NEXT_PUBLIC_BACKEND_HOSTNAME = "workrant.onrender.com"
  NEXT_PUBLIC_BACKEND_PORT = "443"
  NEXT_PUBLIC_MEDIA_URL = "https://workrant.onrender.com/media"
  NODE_ENV = "production"
  NEXT_PUBLIC_ENVIRONMENT = "production"
  NEXT_PUBLIC_SECURE_MODE = "true"
  NEXT_PUBLIC_DEBUG = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://www.workrant.app/*"
  to = "https://workrant.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.workrant.app/*"
  to = "https://workrant.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.workrant.netlify.app/*"
  to = "https://workrant.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://workrant.app/*"
  to = "https://workrant.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://workrant.netlify.app/*"
  to = "https://workrant.netlify.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://workrant.onrender.com https://api.workrant.app https://api.workrant.app/media http://localhost:8000; frame-src 'self';"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
