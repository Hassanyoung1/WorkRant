# Railway Deployment Configuration
# For WorkRant Django Backend

# Build settings for Railway
build:
  provider: nixpacks
  
# Environment variables needed for Railway deployment
env:
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  DEBUG: false
  ALLOWED_HOSTS: ${{ RAILWAY_PUBLIC_DOMAIN }}
  USE_POSTGRES: true
  DATABASE_URL: ${{ DATABASE_URL }}
  CORS_ALLOWED_ORIGINS: https://workrant.vercel.app,https://www.workrant.com
  
# Start command
start: gunicorn workrant_backend.wsgi:application --bind 0.0.0.0:$PORT

# Health check
healthcheck:
  path: /api/health/
  
# Auto-deploy from GitHub
deploy:
  branch: main
  auto: true